<header
  class="fixed top-0 z-10 flex items-center justify-center w-full mx-auto mt-2"
>
  <nav
    class="flex px-3 text-sm font-medium rounded-full text-gray-600 dark:text-gray-200 justify-center items-center"
  >
    @for (item of navItems; track item.title) {
      @if (item.fragment) {
        <a
          class="relative block px-2 py-2 transition hover:text-yellow-500 dark:hover:text-yellow-400"
          [class.text-yellow-500]="activeSection() === item.fragment"
          [routerLink]="'/'"
          [fragment]="item.fragment"
          [attr.aria-label]="item.label"
          [attr.aria-current]="
            activeSection() === item.fragment ? 'location' : null
          "
        >
          {{ item.title }}
        </a>
      } @else {
        <a
          class="relative block px-2 py-2 transition hover:text-yellow-500 dark:hover:text-yellow-400"
          [href]="item.href ?? ''"
          [attr.aria-label]="item.label"
        >
          {{ item.title }}
        </a>
      }
    }

    <app-theme-toggle></app-theme-toggle>
  </nav>
</header>
