<div class="relative ml-1 mr-1">
  <button
    id="theme-toggle-btn"
    type="button"
    class="appearance-none border-none flex hover:scale-125 transition"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleMenu($event)"
  >
    <span class="sr-only">Elige el tema</span>

    <svg
      id="light"
      class="theme-toggle-icon size-5 transition-all"
      [style.scale]="themeService.theme() === 'light' ? 1 : 0"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
      <path
        d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"
      />
    </svg>

    <svg
      id="dark"
      class="theme-toggle-icon absolute size-5 transition-all"
      [style.scale]="themeService.theme() === 'dark' ? 1 : 0"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path
        d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"
      />
    </svg>

    <svg
      id="system"
      class="theme-toggle-icon absolute size-5 transition-all"
      [style.scale]="themeService.theme() === 'system' ? 1 : 0"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path
        d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10z"
      />
      <path d="M7 20h10" />
      <path d="M9 16v4" />
      <path d="M15 16v4" />
    </svg>
  </button>

  <div
    id="themes-menu"
    class="absolute hidden top-8 right-0 text-sm p-1 min-w-[8rem] rounded-md border border-gray-100 bg-white/90 dark:bg-gray-900/90 dark:border-gray-500/20 shadow-[0_3px_10px_rgb(0,0,0,0.2)] backdrop-blur-md"
    [class.open]="isOpen()"
  >
    <ul>
      @for (option of themeOptions; track option.value) {
        <li
          class="themes-menu-option px-2 py-1.5 cursor-pointer hover:bg-neutral-400/40 dark:hover:bg-gray-500/50 rounded-sm"
          (click)="selectTheme(option.value)"
        >
          {{ option.label }}
        </li>
      }
    </ul>
  </div>
</div>
